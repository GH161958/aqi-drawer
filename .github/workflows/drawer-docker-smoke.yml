name: Drawer Docker smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker-smoke:
    name: docker-smoke (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default-8787
            port: 8787
            explicit_port: false
          - name: explicit-8080
            port: 8080
            explicit_port: true

    env:
      CONTAINER_NAME: aqi-drawer-ci-${{ matrix.name }}
      VOLUME_NAME: aqi-drawer-ci-data-${{ matrix.name }}
      IMAGE_TAG: aqi-drawer:ci-${{ matrix.name }}
      TEST_PORT: ${{ matrix.port }}
      EXPLICIT_PORT: ${{ matrix.explicit_port }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag "$IMAGE_TAG" .

      - name: Start isolated production container
        run: |
          docker volume create "$VOLUME_NAME"

          bridge_token="$(openssl rand -hex 32)"
          drawer_secret="$(openssl rand -hex 32)"
          drop_secret="$(openssl rand -hex 32)"
          mcp_suffix="$(openssl rand -hex 32)"
          port_option=()

          if [ "$EXPLICIT_PORT" = "true" ]; then
            port_option=(--env "PORT=${TEST_PORT}")
          fi

          docker run --detach \
            --name "$CONTAINER_NAME" \
            --publish "127.0.0.1:${TEST_PORT}:${TEST_PORT}" \
            --mount "type=volume,source=${VOLUME_NAME},target=/app/data" \
            --env "C_POCKET_BRIDGE_TOKEN=${bridge_token}" \
            --env "C_POCKET_DRAWER_SECRET=${drawer_secret}" \
            --env "C_POCKET_DROP_SECRET=${drop_secret}" \
            --env "C_POCKET_MCP_PATH=/mcp/${mcp_suffix}" \
            "${port_option[@]}" \
            "$IMAGE_TAG"

      - name: Wait for Docker health check
        run: |
          for attempt in $(seq 1 45); do
            running="$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")"
            health="$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER_NAME")"
            printf 'attempt=%s running=%s health=%s\n' "$attempt" "$running" "$health"

            if [ "$running" != "true" ]; then
              docker logs "$CONTAINER_NAME"
              exit 1
            fi

            if [ "$health" = "healthy" ]; then
              exit 0
            fi

            if [ "$health" = "unhealthy" ]; then
              docker logs "$CONTAINER_NAME"
              exit 1
            fi

            sleep 2
          done

          docker logs "$CONTAINER_NAME"
          echo 'Container did not become healthy before the timeout.' >&2
          exit 1

      - name: Verify production routes
        run: |
          check_route() {
            label="$1"
            path="$2"
            status="$(curl --silent --show-error --output /tmp/aqi-drawer-response --write-out '%{http_code}' "http://127.0.0.1:${TEST_PORT}${path}")"
            printf '%s %s -> HTTP %s\n' "$label" "$path" "$status"

            if [ "$status" != "200" ]; then
              cat /tmp/aqi-drawer-response
              exit 1
            fi
          }

          check_route health /health
          check_route legacy-drawer /drawer
          check_route react-drawer /drawer-next

          test "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")" = "true"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER_NAME")" = "healthy"
          echo 'Container remains running and healthy after route smoke tests.'

      - name: Clean up isolated container and data
        if: always()
        run: |
          docker rm --force "$CONTAINER_NAME" 2>/dev/null || true
          docker volume rm "$VOLUME_NAME" 2>/dev/null || true
