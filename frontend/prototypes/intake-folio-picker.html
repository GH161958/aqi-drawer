<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aqi Drawer · Intake Folio Picker</title>
  <style>
    :root {
      color-scheme: light;
      --room: #eee8dc;
      --ink: #39332d;
      --quiet-ink: #786f64;
      --walnut: #7b6252;
      --walnut-dark: #5d493e;
      --rail: #806656;
      --paper: #efe4d2;
      --paper-back: #e4d6c0;
      --drawer-paper: #e8decd;
      --sage: #5b6656;
      --rule: rgba(92, 73, 57, .18);
      --ease-object: cubic-bezier(.22, 1, .36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 0;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow-x: hidden;
      color: var(--ink);
      background: var(--room);
      font-family: Georgia, "Times New Roman", serif;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .prototype-shell {
      width: min(100%, 760px);
      min-height: 100svh;
      margin: 0 auto;
      padding:
        max(28px, env(safe-area-inset-top))
        16px
        max(92px, env(safe-area-inset-bottom));
    }

    .prototype-header {
      width: min(100%, 520px);
      margin: 0 auto 28px;
      text-align: center;
    }

    .prototype-header p,
    .prototype-header h1 {
      margin: 0;
    }

    .prototype-header p {
      color: #9b7d4d;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .prototype-header h1 {
      margin-top: 8px;
      font-size: clamp(38px, 10vw, 68px);
      font-weight: 400;
      line-height: .96;
      letter-spacing: -.035em;
    }

    .prototype-tools {
      display: flex;
      justify-content: center;
      margin-top: 16px;
    }

    .motion-toggle {
      min-height: 34px;
      padding: 5px 10px;
      border: 0;
      border-bottom: 1px solid rgba(83, 96, 78, .28);
      color: var(--sage);
      background: transparent;
      cursor: pointer;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      letter-spacing: .04em;
    }

    .motion-toggle[aria-pressed="true"] {
      color: var(--ink);
      border-bottom-color: rgba(52, 46, 39, .58);
    }

    #stage {
      min-height: 640px;
    }

    .variant {
      width: 100%;
    }

    .variant-note {
      width: min(100%, 430px);
      margin: 0 auto 22px;
      text-align: center;
    }

    .variant-note h2,
    .variant-note p {
      margin: 0;
    }

    .variant-note h2 {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .08em;
    }

    .variant-note p {
      margin-top: 7px;
      color: var(--quiet-ink);
      font-size: 13px;
      line-height: 1.45;
    }

    .cabinet-scene {
      display: grid;
      min-height: 520px;
      align-content: start;
      padding-top: 34px;
    }

    .cabinet {
      position: relative;
      isolation: isolate;
      width: min(92vw, 420px);
      margin: 0 auto;
      padding: 44px 11px 17px;
      border: 1px solid rgba(70, 52, 42, .24);
      background: var(--walnut);
      box-shadow:
        inset 3px 0 rgba(255, 255, 255, .025),
        inset -3px 0 rgba(47, 33, 26, .08),
        0 15px 24px rgba(55, 39, 29, .085);
    }

    .cabinet::before {
      position: absolute;
      inset: 7px;
      border: 1px solid rgba(225, 205, 167, .075);
      content: "";
      pointer-events: none;
    }

    .type-trigger {
      position: absolute;
      z-index: 2;
      top: 0;
      right: 8px;
      display: grid;
      width: 44px;
      height: 44px;
      border: 0;
      background: transparent;
      place-items: center;
      pointer-events: none;
    }

    .type-trigger::before {
      width: 8px;
      height: 8px;
      border: 1px solid rgba(89, 68, 42, .54);
      border-radius: 50%;
      background: #a98a55;
      box-shadow: inset 0 1px rgba(255, 248, 222, .26);
      content: "";
    }

    .top-rail {
      position: absolute;
      z-index: 7;
      top: -6px;
      right: -6px;
      left: -6px;
      height: 17px;
      pointer-events: none;
    }

    .top-rail::before {
      position: absolute;
      inset: 0 0 auto;
      height: 8px;
      border-bottom: 1px solid rgba(63, 43, 32, .24);
      background: var(--rail);
      box-shadow: 0 5px 8px rgba(47, 33, 26, .11);
      content: "";
    }

    .top-rail::after {
      position: absolute;
      top: 8px;
      right: 6px;
      bottom: 0;
      left: 6px;
      background: var(--walnut);
      content: "";
    }

    .cabinet-label {
      position: absolute;
      z-index: 3;
      top: 15px;
      left: 20px;
      min-height: 17px;
      padding: 4px 10px;
      border: 1px solid rgba(151, 123, 77, .56);
      color: #e7dcc7;
      background: #634e40;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9px;
      letter-spacing: .08em;
    }

    .drawer-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 3px;
      padding: 6px;
      border: 1px solid rgba(45, 31, 24, .24);
      background: var(--walnut-dark);
      box-shadow: inset 0 3px 5px rgba(31, 21, 16, .12);
    }

    .drawer {
      position: relative;
      min-height: 92px;
      border: 0;
      border-top: 1px solid rgba(255, 255, 255, .42);
      border-right: 1px solid rgba(76, 50, 37, .16);
      border-bottom: 2px solid rgba(76, 50, 37, .26);
      border-left: 1px solid rgba(255, 255, 255, .20);
      background: var(--drawer-paper);
      box-shadow:
        inset 0 -4px 7px rgba(76, 50, 37, .025),
        0 1px rgba(25, 16, 12, .14);
    }

    .drawer:nth-child(3n + 2) {
      background: #ebe1d1;
    }

    .drawer::before {
      position: absolute;
      top: 18px;
      left: 50%;
      width: 76px;
      height: 19px;
      border: 1px solid rgba(137, 109, 69, .40);
      background: #f1e9da;
      content: "";
      transform: translateX(-50%);
    }

    .drawer::after {
      position: absolute;
      bottom: 11px;
      left: 50%;
      width: 27px;
      height: 7px;
      border: 1px solid #806536;
      border-radius: 1px 1px 6px 6px;
      background: #897049;
      box-shadow: inset 0 1px rgba(213, 185, 126, .42);
      content: "";
      transform: translateX(-50%);
    }

    .cabinet-base {
      width: calc(100% + 12px);
      height: 8px;
      margin: 12px 0 -22px -6px;
      border-top: 1px solid rgba(214, 192, 148, .12);
      background: #705749;
      box-shadow: 0 7px 9px -5px rgba(47, 33, 26, .18);
    }

    .folio-stage {
      position: absolute;
      z-index: 4;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .folio {
      position: absolute;
      z-index: 4;
      top: 2px;
      left: 50%;
      width: 76%;
      max-height: calc(100% - 18px);
      overflow-y: auto;
      padding: 24px 20px 19px;
      border-top: 1px solid rgba(89, 66, 49, .16);
      color: var(--ink);
      background: var(--paper);
      box-shadow:
        5px 6px 0 rgba(226, 213, 193, .9),
        0 8px 10px -9px rgba(36, 24, 18, .24);
      scrollbar-width: none;
      transform: translate(-50%, calc(-100% + 18px));
      pointer-events: auto;
    }

    .folio::-webkit-scrollbar {
      display: none;
    }

    .demo[data-open] .folio {
      transform: translate(-50%, 12px);
    }

    .folio-head,
    .folio-attachment,
    .folio-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .folio-head {
      padding-bottom: 10px;
      border-bottom: 1px solid var(--rule);
    }

    .folio-head span,
    .folio-attachment,
    .folio-actions button,
    .folio-close {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9px;
      letter-spacing: .08em;
    }

    .folio-close,
    .folio-actions button {
      min-height: 32px;
      padding: 5px 0;
      border: 0;
      border-bottom: 1px solid rgba(83, 96, 78, .30);
      color: var(--sage);
      background: transparent;
      cursor: pointer;
    }

    .folio textarea {
      display: block;
      width: 100%;
      min-height: 112px;
      resize: none;
      padding: 18px 0 13px;
      border: 0;
      border-bottom: 1px solid var(--rule);
      outline: 0;
      color: var(--ink);
      background: transparent;
      font-size: 16px;
      line-height: 1.6;
      pointer-events: none;
    }

    .folio textarea::placeholder {
      color: rgba(52, 46, 39, .42);
    }

    .folio-attachment {
      min-height: 42px;
      color: var(--quiet-ink);
    }

    .folio-slips {
      display: grid;
      gap: 3px;
      margin: 0;
      padding: 0 0 0 4px;
      list-style: none;
    }

    .folio-slips li {
      padding: 8px 9px;
      border-left: 2px solid rgba(137, 112, 73, .20);
      background: rgba(239, 228, 210, .48);
      font-size: 12px;
    }

    .folio-slips li:nth-child(even) {
      transform: translateY(1px);
    }

    .folio-slips small {
      display: block;
      margin-top: 3px;
      color: var(--quiet-ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 8px;
    }

    .folio-actions {
      justify-content: flex-end;
      margin-top: 10px;
    }

    .entrance-hit {
      position: absolute;
      z-index: 9;
      top: -14px;
      left: 25%;
      width: 148px;
      height: 44px;
      border: 0;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
      transform: translateX(-50%);
    }

    .entrance-visual {
      position: absolute;
      pointer-events: none;
    }

    .divider-folio {
      --duration: 330ms;
      --variant-ease: cubic-bezier(.25, .76, .3, 1);
    }

    .divider-folio .folio {
      width: 78%;
      transition: transform var(--duration) var(--variant-ease);
    }

    .divider-folio:not([data-open]):not([data-returning]) .folio {
      transform: translate(-50%, calc(-100% - 2px));
    }

    .folio-index-demo .entrance-hit {
      left: 27%;
    }

    .folio-index {
      z-index: 5;
      top: -19px;
      left: 27%;
      width: 88px;
      height: 22px;
      padding: 0 6px;
      border: 1px solid rgba(116, 93, 71, .16);
      border-bottom: 0;
      border-radius: 2px 2px 0 0;
      color: var(--quiet-ink);
      background: var(--paper);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9px;
      letter-spacing: .02em;
      transform: translateX(-50%);
      transition: transform var(--duration) var(--variant-ease);
    }

    .folio-index > span {
      position: absolute;
      top: 1px;
      right: 6px;
      left: 6px;
      height: 12px;
      line-height: 12px;
      text-align: center;
      white-space: nowrap;
    }

    .folio-index-demo .entrance-hit:active + .folio-index {
      transform: translate(-50%, 1px);
    }

    .folio-index-demo[data-open] .folio-index {
      z-index: 8;
      transform: translate(-50%, 11px);
    }

    .folio-index-demo[data-returning] .folio-index {
      transform: translateX(-50%);
      transition-duration: 260ms;
    }

    .index-offset .entrance-hit,
    .index-offset .folio-index {
      left: 24%;
    }

    .index-narrow .entrance-hit,
    .index-narrow .folio-index {
      left: 26%;
    }

    .index-narrow .folio-index {
      top: -20px;
      width: 76px;
      height: 24px;
      font-size: 9px;
    }

    .demo[data-success] .success-default,
    .demo:not([data-success]) .success-done {
      display: none;
    }

    .demo[data-returning] .folio {
      transform: translate(-50%, calc(-100% + 18px));
      transition-duration: 260ms;
    }

    .demo[data-reduced] .folio,
    .demo[data-reduced] .folio-index,
    html[data-reduced] .folio,
    html[data-reduced] .folio-index {
      transition-duration: 1ms;
    }

    @media (prefers-reduced-motion: reduce) {
      .folio,
      .folio-index {
        transition-duration: 1ms !important;
      }
    }

    @media (max-width: 520px) {
      .prototype-shell {
        padding-inline: 10px;
      }

      .prototype-header {
        margin-bottom: 20px;
      }

      #stage {
        min-height: 590px;
      }

      .cabinet-scene {
        min-height: 500px;
        padding-top: 30px;
      }

      .cabinet {
        width: min(94vw, 364px);
        padding-top: 42px;
      }

      .drawer {
        min-height: 132px;
      }

      .folio {
        width: 84%;
        padding: 22px 14px 17px;
      }

      .divider-folio .folio {
        width: 86%;
      }

      .folio textarea {
        min-height: 122px;
      }

    }

    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    .proto-picker-highlight {
      position: absolute;
      top: 4px;
      left: 0;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      will-change: transform;
    }

    .proto-picker[data-ready] .proto-picker-highlight {
      transition:
        transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
        width 250ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
    }

    .proto-picker-item {
      position: relative;
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
    }

    .proto-picker-item:hover {
      color: rgba(255, 255, 255, 0.85);
    }

    .proto-picker-item:active {
      transform: scale(0.97);
    }

    .proto-picker-item:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.4);
      outline-offset: 2px;
    }

    .proto-picker-item[data-active] {
      color: #fff;
    }

    .proto-picker-divider {
      width: 1px;
      height: 16px;
      margin: 0 4px;
      background: rgba(255, 255, 255, 0.12);
    }

    .proto-picker-replay {
      padding: 0 10px;
      font-size: 14px;
    }

    .proto-picker[data-position="top"] {
      bottom: auto;
      top: 24px;
    }
  </style>
</head>
<body>
  <main class="prototype-shell">
    <header class="prototype-header">
      <p>Visual comparison prototype</p>
      <h1>Incoming Folio</h1>
      <div class="prototype-tools">
        <button class="motion-toggle" type="button" aria-pressed="false">
          Reduced motion preview: off
        </button>
      </div>
    </header>

    <div id="stage"></div>
  </main>

  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Centered</button>
    <button class="proto-picker-item">Offset</button>
    <button class="proto-picker-item">Narrow</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>

  <script>
    const folioBody = (label, successMarkup = '') => `
      <div class="folio-stage">
        <section class="folio" aria-label="Incoming folio">
          <div class="folio-head">
            <span>${label}</span>
            <button class="folio-close" type="button" data-close>放回</button>
          </div>
          <textarea readonly tabindex="-1" placeholder="粘贴一个链接，或留下一段文字……"></textarea>
          <div class="folio-attachment">
            <span>夹入文件</span>
            <span>2 / 5</span>
          </div>
          <ul class="folio-slips">
            <li>抽屉多文件验收甲.docx<small>DOCX · 24 KB</small></li>
            <li>一页散步时留下的照片.jpg<small>JPEG · 1.8 MB</small></li>
          </ul>
          <div class="folio-actions">
            <button type="button" data-success-action>收好 →</button>
          </div>
          ${successMarkup}
        </section>
      </div>`;

    const cabinet = (variantClass, controls, label, intent, bodyLabel, successMarkup = '') => `
      <section class="variant">
        <div class="variant-note">
          <h2>${label}</h2>
          <p>${intent}</p>
        </div>
        <div class="cabinet-scene">
          <div class="cabinet demo ${variantClass}">
            ${controls}
            ${folioBody(bodyLabel, successMarkup)}
            <span class="type-trigger" aria-hidden="true"></span>
            <span class="top-rail" aria-hidden="true"></span>
            <span class="cabinet-label">都在这里</span>
            <div class="drawer-grid" aria-hidden="true">
              <span class="drawer"></span><span class="drawer"></span>
              <span class="drawer"></span><span class="drawer"></span>
              <span class="drawer"></span><span class="drawer"></span>
            </div>
            <div class="cabinet-base" aria-hidden="true"></div>
          </div>
        </div>
      </section>`;

    const variants = [
      () => cabinet(
        'divider-folio folio-index-demo index-centered',
        `<button class="entrance-hit" type="button" data-folio-trigger aria-label="打开 Incoming folio"></button>
        <span class="entrance-visual folio-index" aria-hidden="true">
          <span class="success-default">留给阿栖</span>
          <span class="success-done">已收好</span>
        </span>`,
        'A · Centered Index',
        '沿用当前微型索引的尺度，以自然中文排版作为比较基准。',
        'INCOMING / 01',
      ),
      () => cabinet(
        'divider-folio folio-index-demo index-offset',
        `<button class="entrance-hit" type="button" data-folio-trigger aria-label="打开 Incoming folio"></button>
        <span class="entrance-visual folio-index" aria-hidden="true">
          <span class="success-default">留给阿栖</span>
          <span class="success-done">已收好</span>
        </span>`,
        'B · Offset Registry Index',
        '索引略向左偏，与内页登记编号建立更明确的视觉轴线。',
        'INCOMING / 01',
      ),
      () => cabinet(
        'divider-folio folio-index-demo index-narrow',
        `<button class="entrance-hit" type="button" data-folio-trigger aria-label="打开 Incoming folio"></button>
        <span class="entrance-visual folio-index" aria-hidden="true">
          <span class="success-default">留给阿栖</span>
          <span class="success-done">已收好</span>
        </span>`,
        'C · Narrow File Index',
        '更窄、略高的 index ear，保持物件感而不形成按钮。',
        'INCOMING / 01',
      ),
    ];

    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    const motionToggle = document.querySelector('.motion-toggle');
    let current = 0;
    let sequence = 0;

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i) {
      sequence += 1;
      stage.innerHTML = '';
      requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });

    stage.addEventListener('click', (event) => {
      const trigger = event.target.closest('[data-folio-trigger]');
      const close = event.target.closest('[data-close]');
      const success = event.target.closest('[data-success-action]');
      const demo = event.target.closest('.demo');
      if (!demo) return;

      if (trigger) {
        const run = ++sequence;
        demo.removeAttribute('data-success');
        window.setTimeout(() => {
          if (run === sequence) demo.setAttribute('data-open', '');
        }, 70);
      }

      if (close) {
        sequence += 1;
        demo.removeAttribute('data-open');
      }

      if (success) {
        const run = ++sequence;
        demo.setAttribute('data-returning', '');
        window.setTimeout(() => {
          if (run !== sequence) return;
          demo.removeAttribute('data-open');
          demo.removeAttribute('data-returning');
          demo.setAttribute('data-success', '');
          window.setTimeout(() => {
            if (run === sequence) demo.removeAttribute('data-success');
          }, 1700);
        }, 260);
      }
    });

    motionToggle.addEventListener('click', () => {
      const reduced = !document.documentElement.hasAttribute('data-reduced');
      document.documentElement.toggleAttribute('data-reduced', reduced);
      motionToggle.setAttribute('aria-pressed', String(reduced));
      motionToggle.textContent = `Reduced motion preview: ${reduced ? 'on' : 'off'}`;
    });

    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
</html>
